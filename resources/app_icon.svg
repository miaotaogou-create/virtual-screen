<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="fluentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="44" height="44" rx="11" ry="11" fill="url(#fluentGrad)" filter="url(#subtleGlow)"/>
  <!-- 整体下移，缩短底座到底边的蓝色空白 -->
  <rect x="10" y="13" width="28" height="20" rx="3.5" ry="3.5" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <line x1="24" y1="33" x2="24" y2="38.5" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
  <line x1="17" y1="38.5" x2="31" y2="38.5" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
</svg>
